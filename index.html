<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GM8 Graph Editor Pro - 无边界作用域版</title>
    <link href="index.css" rel="stylesheet">
    <script src="index.ts" defer></script>
</head>
<body>

<div id="toolbar">
    <button onclick="addObject('node')">+ 对话节点</button>
    <button onclick="addObject('condition')" style="background: #e67e22;">+ 条件判定</button>
    <button onclick="addObject('comment')" style="background: #5865f2;">+ 注释区域</button>
    <div style="flex-grow: 1;"></div>
    <label class="file-label">导入 GML 工程 <input type="file" id="importInput" hidden onchange="importProject(this)"></label>
    <button onclick="exportProject()" style="background: #43b581;">导出 GML 系统</button>
</div>

<div id="viewport">
    <div id="content-layer">
        <canvas id="line-canvas"></canvas>
        <div id="objects-container"></div>
    </div>
</div>

<div id="minimap">
    <canvas id="minimap-canvas"></canvas>
    <div id="minimap-view"></div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h3 id="m-title" style="margin:0">节点配置</h3>
        <div class="lang-box">
            <div style="display:flex;flex-direction:column;gap:5px">
                <label style="font-size:12px;color:#888">中文 (lang_cn)</label>
                <textarea id="m-cn" rows="4"></textarea>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px">
                <label style="font-size:12px;color:#888">英文 (lang_en)</label>
                <textarea id="m-en" rows="4"></textarea>
            </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
            <label style="font-size:12px;color:#888">执行代码 / 条件表达式 (GML)</label>
            <textarea id="m-code" rows="5"></textarea>
        </div>
        <div class="color-row">
            <label>自定义颜色:</label>
            <input type="color" id="m-color">
            <div style="flex-grow:1"></div>
            <button onclick="deleteCurrent()" style="background:#f04747">删除此节点</button>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
            <button onclick="closeModal()" style="background:#4f545c">取消</button>
            <button onclick="saveModal()">保存配置</button>
        </div>
    </div>
</div>
</body>
</html>
