<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>对话编辑器</title>
    <link href="index.css" rel="stylesheet">
</head>
<body>
<div id="root">

<div id="toolbar">
</div>

<div id="viewport">
    <div id="content-layer">
        <canvas id="line-canvas"></canvas>
        <div id="objects-container"></div>
    </div>
</div>

<div id="minimap">
    <canvas id="minimap-canvas"></canvas>
    <div id="minimap-view"></div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h3 id="m-title" style="margin:0">节点配置</h3>
        <div class="lang-box">
            <div style="display:flex;flex-direction:column;gap:5px">
                <label style="font-size:12px;color:#888">中文</label>
                <textarea id="m-cn" rows="4"></textarea>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px">
                <label style="font-size:12px;color:#888">英文</label>
                <textarea id="m-en" rows="4"></textarea>
            </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
            <label style="font-size:12px;color:#888">执行代码</label>
            <textarea id="m-code" rows="5"></textarea>
        </div>
        <div class="color-row">
            <label>自定义颜色:</label>
            <input type="color" id="m-color">
            <div style="flex-grow:1"></div>
            <button onclick="deleteCurrent()" style="background:#f04747">删除此节点</button>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
            <button onclick="closeModal()" style="background:#4f545c">取消</button>
            <button onclick="saveModal()">保存配置</button>
        </div>
    </div>
</div>
</div>
<script type="module" src="/src/renderer/main.tsx"></script>
</body>
</html>
